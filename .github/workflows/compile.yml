name: Build Mod Menu

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Theos Locally
        run: |
          git clone --recursive https://github.com/theos/theos.git $HOME/theos

      - name: Compile mod.xm directly
        run: |
          export THEOS=$HOME/theos
          export PATH="$THEOS/bin:$PATH"
          logos.pl mod.xm > mod.mm
          xcrun --sdk iphoneos clang++ -dynamiclib -arch arm64 -o MamaHala.dylib mod.mm -framework Foundation -framework UIKit -framework CoreGraphics -framework QuartzCore -fobjc-arc

      - name: Upload dylib artifact
        uses: actions/upload-artifact@v4
        with:
          name: MamaHala
          path: MamaHala.dylib
