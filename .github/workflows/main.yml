name: Build MamaHala Dylib

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Theos
      run: |
        git clone --recursive https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH

    - name: Create Makefile and Control
      run: |
        echo "TARGET := iphone:clang:latest:14.0" > Makefile
        echo "include \$(THEOS)/makefiles/common.mk" >> Makefile
        echo "TWEAK_NAME = MamaHala" >> Makefile
        echo "MamaHala_FILES = mod.xm" >> Makefile
        echo "MamaHala_CFLAGS = -fobjc-arc" >> Makefile
        echo "include \$(THEOS_MAKE_PATH)/tweak.mk" >> Makefile

        echo "Package: com.mamahala.mod" > control
        echo "Name: MamaHala" >> control
        echo "Depends: mobilesubstrate" >> control
        echo "Version: 1.0.0" >> control
        echo "Architecture: iphoneos-arm" >> control
        echo "Maintainer: MamaHala" >> control
        echo "Author: MamaHala" >> control
        echo "Section: Tweaks" >> control

        echo '{"Filter":{"Bundles":["com.rekoo.pubg"]}}' > MamaHala.plist

    - name: Build Package
      run: make package

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MamaHala-Dylib
        path: packages/*.deb
