name: Build Mod Menu

on: [push]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install Theos Manually
        run: |
          git clone --recursive https://github.com/theos/theos.git /var/theos
          echo "THEOS=/var/theos" >> $GITHUB_ENV
          echo "/var/theos/bin" >> $GITHUB_PATH

      - name: Compile dylib
        run: |
          make package
